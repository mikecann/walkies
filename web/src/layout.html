<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{url}}">
  <meta name="theme-color" content="#fbf4e6">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Walkies">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:image" content="{{site}}/img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="The Walkies boot icon on cream paper, with the words: Go for a walk and the clouds lift off your suburb.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{site}}/img/og.png">
  {{appStoreMeta}}
  <link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/img/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="/styles.css?v={{version}}">
</head>
<body class="page-{{page}}">
  <header class="top">
    <a class="brand" href="/"><img src="/img/icon-192.png" alt="" width="40" height="40"><span>Walkies</span></a>
    <nav>
      <a href="/support"{{supportCurrent}}>Help</a>
      <a href="/privacy"{{privacyCurrent}}>Privacy</a>
    </nav>
  </header>
  <main>
{{content}}
  </main>
  <footer class="bottom">
    <p>Walkies is a small app by Mike Cann, made in Western Australia. Suburb outlines and streets © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors.</p>
    <p><a href="/">Home</a> · <a href="/support">Help</a> · <a href="/privacy">Privacy</a> · <a href="mailto:{{email}}">{{email}}</a></p>
  </footer>
</body>
</html>
